<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFC107">
  <title>Driver App · {{ app_name }}</title>
  <link rel="manifest" href="/static/driver.webmanifest">
  <link rel="apple-touch-icon" href="/company/logo">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="icon" href="/company/logo">
  <link href="/static/css/style.css?v=14" rel="stylesheet">
</head>
<body>
<main class="content page-fade" style="padding:14px 14px 44px;max-width:680px;margin:0 auto">

  <div class="portal-hero animate-in mb-3">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <div style="font-size:12.5px;opacity:.85">Welcome back</div>
        <h4 class="fw-bold mb-1">{{ driver.driver_name }}</h4>
        <div style="font-size:13px">
          <i class="bi bi-truck-front-fill me-1"></i>
          {{ driver.assigned_vehicle or 'No vehicle assigned' }}
        </div>
      </div>
      <a href="/driver-portal/logout" class="btn btn-ghost btn-sm" title="Sign out">
        <i class="bi bi-box-arrow-right"></i>
      </a>
    </div>
  </div>

  <div class="d-flex gap-2 align-items-center mb-3">
    <input type="month" class="form-control" id="fMonth" style="max-width:180px" onchange="loadData()">
    <button class="btn btn-gold ms-auto" onclick="openModal('dieselModal')">
      <i class="bi bi-plus-lg me-1"></i> Add Diesel
    </button>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-6"><div class="glass-card stat-card animate-in">
      <div class="stat-icon"><i class="bi bi-cash-coin"></i></div>
      <div><div class="stat-label">Salary (gross)</div><div class="stat-value" id="stGross">—</div></div>
    </div></div>
    <div class="col-6"><div class="glass-card stat-card animate-in">
      <div class="stat-icon"><i class="bi bi-arrow-up-right-circle"></i></div>
      <div><div class="stat-label">Advance</div><div class="stat-value text-danger" id="stAdvance">—</div></div>
    </div></div>
    <div class="col-6"><div class="glass-card stat-card animate-in">
      <div class="stat-icon"><i class="bi bi-cup-hot"></i></div>
      <div><div class="stat-label">Meals</div><div class="stat-value" id="stMeals">—</div></div>
    </div></div>
    <div class="col-6"><div class="glass-card stat-card animate-in">
      <div class="stat-icon"><i class="bi bi-fuel-pump"></i></div>
      <div><div class="stat-label">Diesel</div><div class="stat-value" id="stDiesel">—</div></div>
    </div></div>
  </div>

  <div class="glass-card mb-3 animate-in">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <div class="stat-label">Net payable this month</div>
        <div class="stat-value text-success" id="stNet">—</div>
      </div>
      <div class="text-end">
        <div class="stat-label">Days worked</div>
        <div class="stat-value" id="stDays">—</div>
      </div>
    </div>
  </div>

  <div class="portal-tabs mb-3" id="portalTabs">
    <button class="active" data-tab="diesel" onclick="switchTab(this)">Diesel</button>
    <button data-tab="Salary" onclick="switchTab(this)">Salary</button>
    <button data-tab="Advance" onclick="switchTab(this)">Advance</button>
    <button data-tab="Meals" onclick="switchTab(this)">Meals</button>
    <button data-tab="Deduction" onclick="switchTab(this)">Deductions</button>
  </div>

  <div class="glass-card table-card animate-in">
    <div class="table-responsive">
      <table class="table table-premium">
        <thead id="historyHead"></thead>
        <tbody id="historyBody"><tr><td><div class="spinner-gold"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<!-- add diesel -->
<div class="modal fade" id="dieselModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Add Diesel</h5>
      <button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <form id="dieselForm" class="row g-3">
        <div class="col-6"><label class="form-label">Date</label>
          <input type="date" class="form-control" name="entry_date"></div>
        <div class="col-6"><label class="form-label">Vehicle</label>
          <input class="form-control" name="vehicle_number" readonly></div>
        <div class="col-6"><label class="form-label">Litres *</label>
          <input type="number" step="0.01" inputmode="decimal" class="form-control" name="litres"></div>
        <div class="col-6"><label class="form-label">Amount *</label>
          <input type="number" step="0.01" inputmode="decimal" class="form-control" name="amount"></div>
        <div class="col-6"><label class="form-label">Kilometre</label>
          <input type="number" inputmode="numeric" class="form-control" name="kilometre"></div>
        <div class="col-6"><label class="form-label">Fuel Station</label>
          <input class="form-control" name="fuel_station" id="stationInput"></div>
        <div class="col-12">
          <label class="form-label">Payment</label>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-gold flex-fill" id="payPaid"
                    onclick="setPayment('Paid')">Paid</button>
            <button type="button" class="btn btn-ghost flex-fill" id="payKatha"
                    onclick="setPayment('Unpaid')">Katha (credit)</button>
          </div>
          <small class="text-muted" id="paymentHint">Paid in cash or card now.</small>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-gold portal-btn" style="width:auto" onclick="saveDiesel()">
        <i class="bi bi-check-lg me-1"></i> Save Entry</button>
    </div>
  </div></div>
</div>

<div class="toast-holder" id="toastHolder"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js?v=14"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/driver-portal/sw.js", { scope: "/driver-portal" })
    .catch(() => {});
}

let payload = null, activeTab = "diesel", paymentStatus = "Paid";
document.getElementById("fMonth").value = thisMonth();

async function loadData() {
  setLoading("historyBody");
  try {
    payload = await api(`/api/driver-portal/my-data?month=${document.getElementById("fMonth").value}`);
    setText("stGross", fmtMoney(payload.gross));
    setText("stAdvance", fmtMoney(payload.total_advance));
    setText("stMeals", fmtMoney(payload.total_meals));
    setText("stDiesel", fmtNum(payload.total_diesel_litres) + " L");
    setText("stNet", fmtMoney(payload.net_payable));
    setText("stDays", payload.effective_days || "—");
    const form = document.getElementById("dieselForm");
    form.vehicle_number.value = payload.driver.assigned_vehicle || "";
    form.entry_date.value = today();
    renderTab();
  } catch (e) { toastError(e); }
}

function switchTab(btn) {
  document.querySelectorAll("#portalTabs button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeTab = btn.dataset.tab;
  renderTab();
}

function renderTab() {
  if (!payload) return;
  const head = document.getElementById("historyHead");
  if (activeTab === "diesel") {
    head.innerHTML = `<tr><th>Date</th><th>Vehicle</th><th class="text-end">Litres</th>
      <th class="text-end">Amount</th><th>Station</th></tr>`;
    renderRows("historyBody", payload.diesel_entries, d => `<tr>
      <td>${fmtDate(d.entry_date)}</td>
      <td class="fw-bold">${esc(d.vehicle_number || "-")}
        ${(d.payment_status || "Paid") === "Unpaid" ? '<span class="katha-tag ms-1">KATHA</span>' : ""}</td>
      <td class="text-end fw-bold">${fmtNum(d.litres)}</td>
      <td class="text-end">${fmtMoney(d.amount)}</td>
      <td>${esc(d.fuel_station || "-")}</td></tr>`, "No diesel entries this month");
  } else {
    head.innerHTML = `<tr><th>Date</th><th>Description</th><th class="text-end">Amount</th></tr>`;
    const rows = (payload.entries || {})[activeTab] || [];
    renderRows("historyBody", rows, e => `<tr>
      <td>${fmtDate(e.expense_date)}</td>
      <td>${esc(e.description || "-")}</td>
      <td class="text-end fw-bold">${fmtMoney(e.amount)}</td></tr>`,
      `No ${activeTab.toLowerCase()} entries this month`);
  }
}

function setPayment(status) {
  paymentStatus = status;
  const paid = status === "Paid";
  document.getElementById("payPaid").className =
    "flex-fill btn " + (paid ? "btn-gold" : "btn-ghost");
  document.getElementById("payKatha").className =
    "flex-fill btn " + (paid ? "btn-ghost" : "btn-gold");
  document.getElementById("paymentHint").textContent = paid
    ? "Paid in cash or card now."
    : "Added to the station's Katha - fuel station is required.";
  document.getElementById("stationInput").required = !paid;
}

async function saveDiesel() {
  const data = formData(document.getElementById("dieselForm"));
  data.payment_status = paymentStatus;
  if (!Number(data.litres) && !Number(data.amount))
    return toast("Enter litres or amount", "error");
  if (paymentStatus === "Unpaid" && !data.fuel_station)
    return toast("Fuel station is required for Katha entries", "error");
  try {
    await api("/api/driver-portal/diesel", { method: "POST", body: data });
    closeModal("dieselModal");
    toast(paymentStatus === "Unpaid" ? "Saved on Katha" : "Diesel entry saved");
    loadData();
  } catch (e) {
    if (String(e.message).includes("already exists")
        && confirm("A similar entry already exists. Save anyway?")) {
      data.force = true;
      try {
        await api("/api/driver-portal/diesel", { method: "POST", body: data });
        closeModal("dieselModal");
        toast("Diesel entry saved");
        loadData();
      } catch (err) { toastError(err); }
    } else { toastError(e); }
  }
}

setPayment("Paid");
loadData();
</script>
</body>
</html>
