<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFC107">
  <title>Driver Login · {{ app_name }}</title>
  <link rel="manifest" href="/static/driver.webmanifest">
  <link rel="apple-touch-icon" href="/company/logo">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="icon" href="/company/logo">
  <link href="/static/css/style.css?v=13" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="glass-card login-card">
    <img src="/company/logo" alt="" class="login-logo-img">
    <h4 class="fw-bold mb-1">{{ app_name }}</h4>
    <p class="text-muted mb-4" style="font-size:13px">Driver App</p>

    {% if message %}
    <div class="badge-soft warning d-block py-2 mb-3">{{ message }}</div>
    {% endif %}

    <form id="loginForm" onsubmit="event.preventDefault(); signIn();">
      <div class="input-group mb-2">
        <span class="input-group-text" style="border-radius:11px 0 0 11px">+91</span>
        <input type="tel" id="mobile" class="form-control" inputmode="numeric"
               placeholder="Mobile number" maxlength="10" autocomplete="username" required>
      </div>
      <input type="password" id="pin" class="form-control pin-input mb-3"
             inputmode="numeric" placeholder="PIN" maxlength="6"
             autocomplete="current-password" required>
      <button class="btn btn-gold w-100 portal-btn" type="submit" id="signInBtn">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <p class="text-muted mt-3 mb-0" style="font-size:11.5px">
      Forgot your PIN? Ask the office to reset it for you.
    </p>
  </div>
</div>

<div class="toast-holder" id="toastHolder"></div>
<script src="/static/js/app.js?v=13"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/driver-portal/sw.js", { scope: "/driver-portal" })
    .catch(() => {});
}

async function signIn() {
  const mobile = document.getElementById("mobile").value.trim();
  const pin = document.getElementById("pin").value.trim();
  if (mobile.length !== 10) return toast("Enter your 10-digit mobile number", "error");
  if (pin.length < 4) return toast("Enter your PIN", "error");
  const btn = document.getElementById("signInBtn");
  btn.disabled = true;
  try {
    const res = await api("/api/driver-portal/login", { method: "POST", body: { mobile, pin } });
    window.location.href = res.redirect || "/driver-portal";
  } catch (e) {
    toastError(e);
    document.getElementById("pin").value = "";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
