<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · {{ app_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link href="/static/css/style.css?v=4" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="glass-card login-card">
    <img src="/static/img/logo.png" alt="TSR" class="login-logo-img"
         onerror="this.style.display='none';document.getElementById('loginFallback').style.display='grid'">
    <div class="login-logo" id="loginFallback" style="display:none">TSR</div>
    <h4 class="fw-bold mb-1">TSR Enterprises</h4>
    <p class="text-muted mb-4" style="font-size:13px">Fleet &amp; Finance Management</p>

    <a href="/auth/google" class="btn btn-gold w-100 py-2 mb-3">
      <i class="bi bi-google me-2"></i> Sign in with Google
    </a>

    <div class="d-flex align-items-center my-3">
      <hr class="flex-grow-1"><span class="px-2 text-muted" style="font-size:12px">DRIVER LOGIN</span><hr class="flex-grow-1">
    </div>

    <div id="otpStep1">
      <div class="input-group mb-2">
        <span class="input-group-text" style="border-radius:11px 0 0 11px">+91</span>
        <input type="tel" id="driverMobile" class="form-control" placeholder="Mobile number" maxlength="10">
      </div>
      <button class="btn btn-ghost w-100" id="sendOtpBtn" onclick="sendOtp()">
        <i class="bi bi-phone me-1"></i> Send OTP
      </button>
    </div>

    <div id="otpStep2" style="display:none">
      <input type="text" id="driverOtp" class="form-control text-center mb-2"
             placeholder="Enter 6-digit OTP" maxlength="6" style="letter-spacing:6px;font-weight:700">
      <button class="btn btn-gold w-100 mb-2" onclick="verifyOtp()">
        <i class="bi bi-check2-circle me-1"></i> Verify &amp; Login
      </button>
      <button class="btn btn-link btn-sm text-muted" onclick="resetOtp()">Change number</button>
    </div>
    <div id="recaptchaBox"></div>
  </div>
</div>

<div class="toast-holder" id="toastHolder"></div>
<script src="/static/js/app.js?v=3"></script>

{% if firebase %}
<!-- Firebase Phone Authentication -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({{ firebase | tojson }});
const fbAuth = firebase.auth();
fbAuth.languageCode = "en";
let confirmationResult = null;
let recaptcha = null;

const FIREBASE_ERRORS = {
  "auth/operation-not-allowed": "Phone sign-in is not enabled in the Firebase console (Authentication > Sign-in method > Phone)",
  "auth/billing-not-enabled": "Firebase needs the Blaze plan for real SMS - add a test phone number or upgrade billing",
  "auth/too-many-requests": "Too many attempts from this device - try again later",
  "auth/invalid-phone-number": "Invalid phone number",
  "auth/captcha-check-failed": "reCAPTCHA check failed - refresh the page and try again",
  "auth/invalid-app-credential": "reCAPTCHA token expired - please try again",
  "auth/quota-exceeded": "SMS quota exceeded for today - try again tomorrow",
};

function getRecaptcha() {
  if (!recaptcha) {
    recaptcha = new firebase.auth.RecaptchaVerifier("recaptchaBox", { size: "invisible" });
  }
  return recaptcha;
}

function resetRecaptcha() {
  try { if (recaptcha) recaptcha.clear(); } catch (_) {}
  recaptcha = null;
  const old = document.getElementById("recaptchaBox");
  const fresh = document.createElement("div");
  fresh.id = "recaptchaBox";
  old.replaceWith(fresh);
}

async function sendOtp() {
  const mobile = document.getElementById("driverMobile").value.trim();
  if (mobile.length !== 10) return toast("Enter a valid 10-digit mobile number", "error");
  const btn = document.getElementById("sendOtpBtn");
  btn.disabled = true;
  try {
    // only spend an SMS if this mobile belongs to an active driver
    await api("/api/driver/check-mobile", { method: "POST", body: { mobile } });
    confirmationResult = await fbAuth.signInWithPhoneNumber("+91" + mobile, getRecaptcha());
    toast("OTP sent to +91 " + mobile);
    document.getElementById("otpStep1").style.display = "none";
    document.getElementById("otpStep2").style.display = "block";
    document.getElementById("driverOtp").focus();
  } catch (e) {
    resetRecaptcha();
    toast(FIREBASE_ERRORS[e.code] || e.message || String(e), "error");
  } finally {
    btn.disabled = false;
  }
}

async function verifyOtp() {
  const otp = document.getElementById("driverOtp").value.trim();
  if (otp.length !== 6) return toast("Enter the 6-digit OTP", "error");
  try {
    const result = await confirmationResult.confirm(otp);
    const idToken = await result.user.getIdToken();
    const res = await api("/api/driver/firebase-login", { method: "POST", body: { id_token: idToken } });
    window.location.href = res.redirect || "/driver-portal";
  } catch (e) {
    toastError(e.code === "auth/invalid-verification-code"
      ? new Error("Incorrect OTP, please try again") : e);
  }
}

function resetOtp() {
  document.getElementById("otpStep1").style.display = "block";
  document.getElementById("otpStep2").style.display = "none";
  confirmationResult = null;
}
</script>
{% else %}
<!-- Legacy OTP flow (Fast2SMS / dev mode) - used until Firebase is configured -->
<script>
async function sendOtp() {
  const mobile = document.getElementById("driverMobile").value.trim();
  if (mobile.length !== 10) return toast("Enter a valid 10-digit mobile number", "error");
  try {
    const res = await api("/api/driver/send-otp", { method: "POST", body: { mobile } });
    toast(res.message);
    if (res.dev_otp) toast("Dev OTP: " + res.dev_otp, "info");
    document.getElementById("otpStep1").style.display = "none";
    document.getElementById("otpStep2").style.display = "block";
    document.getElementById("driverOtp").focus();
  } catch (e) { toastError(e); }
}
async function verifyOtp() {
  const mobile = document.getElementById("driverMobile").value.trim();
  const otp = document.getElementById("driverOtp").value.trim();
  try {
    const res = await api("/api/driver/verify-otp", { method: "POST", body: { mobile, otp } });
    window.location.href = res.redirect || "/driver-portal";
  } catch (e) { toastError(e); }
}
function resetOtp() {
  document.getElementById("otpStep1").style.display = "block";
  document.getElementById("otpStep2").style.display = "none";
}
</script>
{% endif %}
</body>
</html>
