<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · {{ app_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="icon" href="/company/logo">
  <link href="/static/css/style.css?v=17" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="glass-card login-card">
    <img src="/company/logo" alt="" class="login-logo-img">
    <h4 class="fw-bold mb-1">{{ app_name }}</h4>
    <p class="text-muted mb-4" style="font-size:13px">{{ app_subtitle }}</p>

    {% if google_ready %}
    <a href="/auth/google" class="btn btn-gold w-100 py-2 mb-3">
      <i class="bi bi-google me-2"></i> Sign in with Google
    </a>
    {% else %}
    <div class="badge-soft warning d-block py-2 mb-3">
      Google sign-in is not configured yet
    </div>
    {% endif %}

    <div class="d-flex align-items-center my-3">
      <hr class="flex-grow-1"><span class="px-2 text-muted" style="font-size:11.5px">DRIVERS</span><hr class="flex-grow-1">
    </div>

    <a href="/driver-portal" class="btn btn-ghost w-100">
      <i class="bi bi-phone me-1"></i> Open the Driver App
    </a>
    <p class="text-muted mt-3 mb-0" style="font-size:11.5px">
      Office staff sign in with Google. Drivers use their mobile number and PIN.
    </p>
  </div>
</div>
</body>
</html>
